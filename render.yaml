services:
  - type: web
    name: garda-api
    plan: free
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GARDA_ENV
        value: development
      - key: GARDA_ALLOWED_ORIGINS
        value: https://garda-sim.vercel.app,https://garda-sim-suntreearts-projects.vercel.app,http://localhost:3000
